spring.application.name=server

# Enable HTTP response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

spring.data.mongodb.uri=${MONGO_URI}
# Keep the same default port as the Node server
server.port=${PORT:8080}

# JWT configuration
app.jwt.secret=${JWT_SECRET:your_secret_key_here_change_in_production}
app.jwt.expiration-ms=2592000000

# CORS (we'll handle via aotations)

# Gemini / Google Generative AI
# Prefer setting GEMINI_API_KEY as an environment variable rather than hardcoding.
gemini.api.key=${GEMINI_API_URL}
# Set the maximum file size (support large Word, PPTX and PDF documents)
spring.servlet.multipart.max-file-size=25MB

# Set the maximum request size (includes text + file)
spring.servlet.multipart.max-request-size=30MB
logging.level.org.apache.fontbox=ERROR
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.poi=ERROR

# Redis cache configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# HikariCP connection pool tuning (Render free tier ~1 CPU)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${SPRING_MAIL_USERNAME}
#spring.mail.password=${SPRING_MAIL_PASSWORD}
# Remove old spring.mail properties and add this:
brevo.api.key=${BREVO_API_KEY}
spring.mail.username=${SPRING_MAIL_USERNAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.org.springframework.mail.javamail.JavaMailSenderImpl=DEBUG


app.base-url=${API_URL}

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

config.cloudinary.cloud.secret=${CLOUDINARY_API_SECRET}
config.cloudinary.cloud.key=${CLOUDINARY_CLOUD_KEY}
config.cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}

groq.api.key=${GROQ_API_KEY}
openrouter.api.key=${OPENROUTER_API_KEY}
ai.primary=${PRIMARY_AI}
openrouter.model=${OPENROUTER_MODEL}